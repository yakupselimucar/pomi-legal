<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">Pomi'yi indir</title>
  <meta name="description" data-i18n-attr="description" content="Pomi'yi iPhone, iPad veya Android telefonuna ücretsiz indir: arkadaşlarınla birlikte odaklan." />
  <meta name="theme-color" content="#FDFAF2" />
  <!-- Yönlendirme sayfası: arama sonucunda ana sayfa çıksın, bu değil. -->
  <meta name="robots" content="noindex, follow" />
  <!-- Önizleme botları JS çalıştırmaz; paylaşılan link bu kartla görünür. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Pomi" />
  <meta property="og:url" content="https://pomifocus.com/indir" />
  <meta property="og:title" content="Pomi'yi indir 🍅" />
  <meta property="og:description" content="Arkadaşlarınla birlikte odaklan. iPhone ve Android'de ücretsiz." />
  <meta property="og:image" content="https://play-lh.googleusercontent.com/WaWFwXR226D_Io_QAYJtJhSvobvVXbsYmC8AEDGRghM6rWmKqVafH-0lv7LazRdnB2Cbn-OiwHuM6Y1K05TnFQ=s512" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' rx='3' fill='%23FBF4E4'/><rect x='7' y='2' width='2' height='2' fill='%2346C39A'/><rect x='5' y='3' width='6' height='2' fill='%2346C39A'/><rect x='3' y='5' width='10' height='8' fill='%2327223D'/><rect x='4' y='6' width='8' height='6' fill='%23E8455B'/><rect x='5' y='7' width='2' height='1' fill='%23FF7A8C'/><rect x='6' y='9' width='1' height='1' fill='%2327223D'/><rect x='9' y='9' width='1' height='1' fill='%2327223D'/></svg>" />

  <script>
    // Yönlendirme <head> içinde, ilk boyamadan önce: telefondan gelen kişi
    // sayfayı görmeden mağazaya geçer. Tarama/test için `?r=0` yönlendirmeyi kapatır.
    (function () {
      var STORES = {
        ios: 'https://apps.apple.com/app/id6784132034',
        android: 'https://play.google.com/store/apps/details?id=com.yakupselimucar.pomi'
      };
      var ua = navigator.userAgent || '';
      // iPadOS 13+ masaüstü Safari gibi "Macintosh" der; dokunmatik ekranından ayırt edilir.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var platform = isIOS ? 'ios' : isAndroid ? 'android' : 'desktop';
      var params = new URLSearchParams(location.search);

      // Gelen utm_* etiketleri Play Console'un "Kullanıcı edinme" raporuna
      // düşsün diye Play'in install referrer parametresine aktarılır.
      var utm = [];
      params.forEach(function (value, key) {
        if (key.indexOf('utm_') === 0) utm.push(key + '=' + encodeURIComponent(value));
      });
      if (utm.length) STORES.android += '&referrer=' + encodeURIComponent(utm.join('&'));

      // Threads/Instagram gibi uygulama içi tarayıcılar web Play linkini kendileri
      // açıp oradan uygulamaya atar. `intent://` doğrudan Play Store uygulamasını açar;
      // açamayan tarayıcı `browser_fallback_url` ile web mağazaya düşer.
      var playQuery = STORES.android.split('?')[1];
      STORES.androidIntent = 'intent://details?' + playQuery +
        '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' +
        encodeURIComponent(STORES.android) + ';end';

      window.POMI_STORES = STORES;
      document.documentElement.setAttribute('data-platform', platform);

      if (platform === 'desktop' || params.get('r') === '0') return;
      // `replace`: geri tuşu kişiyi tekrar bu sayfaya, oradan da yine mağazaya atmasın.
      if (platform === 'ios') {
        location.replace(STORES.ios);
        return;
      }
      location.replace(STORES.androidIntent);
      // Chrome kullanıcı dokunuşu olmadan intent'i sessizce engelleyebilir;
      // sayfa hâlâ görünürse web mağazaya geç.
      setTimeout(function () {
        if (!document.hidden) location.replace(STORES.android);
      }, 1500);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    /* Palet index.html ve oda.html ile birebir aynı. */
    :root {
      --bg: #FDFAF2;
      --cream: #FBF4E4;
      --paper: #FFFFFF;
      --ink: #27223D;
      --ink-soft: #635C7D;
      --line: rgba(39, 34, 61, 0.10);
      --cherry: #FF5B6E;
      --cherry-deep: #E8455B;
      --r-lg: 24px;
      --r-md: 16px;
      --shadow: 0 30px 70px -44px rgba(39, 34, 61, 0.45), 0 2px 4px -2px rgba(39, 34, 61, 0.05);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: light; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.15rem, 5vw, 2.5rem);
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', -apple-system, system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--cherry); outline-offset: 3px; border-radius: 8px; }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      padding: clamp(1.75rem, 6vw, 2.5rem) clamp(1.35rem, 5vw, 2rem);
      text-align: center;
    }

    .mark { width: 64px; height: 64px; margin: 0 auto 1.15rem; display: block; }

    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    .lede { margin-top: 0.55rem; color: var(--ink-soft); font-size: 0.98rem; }

    .actions { margin-top: 1.5rem; display: grid; gap: 0.6rem; }
    .btn {
      display: block;
      padding: 0.95rem 1.1rem;
      border-radius: var(--r-md);
      font-weight: 600;
      font-size: 1rem;
      background: var(--cream);
      color: var(--ink);
      transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease);
    }
    .btn:active { transform: translateY(1px); }
    /* Kişinin kendi mağazası öne çıkar ve en üste gelir; yönlendirme
       engellenirse (bazı uygulama içi tarayıcılar) tek dokunuş yeter. */
    [data-platform="ios"] #ios,
    [data-platform="android"] #android {
      order: -1;
      background: var(--cherry);
      color: #fff;
      box-shadow: 0 14px 28px -18px var(--cherry-deep);
    }

    /* Bilgisayardan açana telefonla okutacağı kod gösterilir. */
    .qr { display: none; margin-top: 1.6rem; }
    [data-platform="desktop"] .qr { display: block; }
    .qr-frame {
      width: 172px;
      margin: 0 auto;
      padding: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
    }
    .qr svg { display: block; width: 100%; height: auto; }
    .qr p { margin-top: 0.7rem; font-size: 0.86rem; color: var(--ink-soft); line-height: 1.5; }

    .langs { margin-top: 1.6rem; display: flex; justify-content: center; gap: 0.35rem; }
    .lang {
      border: 0; background: none; cursor: pointer; padding: 0.3rem 0.6rem;
      border-radius: 999px; font: inherit; font-size: 0.8rem; font-weight: 600;
      color: var(--ink-soft);
    }
    .lang[aria-pressed="true"] { background: var(--cream); color: var(--ink); }
  </style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Pomi">
      <rect width="16" height="16" rx="3" fill="#FBF4E4"/>
      <rect x="7" y="2" width="2" height="2" fill="#46C39A"/>
      <rect x="5" y="3" width="6" height="2" fill="#46C39A"/>
      <rect x="3" y="5" width="10" height="8" fill="#27223D"/>
      <rect x="4" y="6" width="8" height="6" fill="#E8455B"/>
      <rect x="5" y="7" width="2" height="1" fill="#FF7A8C"/>
      <rect x="6" y="9" width="1" height="1" fill="#27223D"/>
      <rect x="9" y="9" width="1" height="1" fill="#27223D"/>
    </svg>

    <h1 data-i18n="heading">Pomi'yi indir</h1>
    <p class="lede" data-i18n="lede">Arkadaşlarınla birlikte odaklan. iPhone ve Android'de ücretsiz.</p>

    <!-- JS kapalıyken de çalışan düz linkler; href'ler betikte güncellenir. -->
    <div class="actions">
      <a class="btn" id="ios" href="https://apps.apple.com/app/id6784132034" data-i18n="ios">App Store'dan indir</a>
      <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.yakupselimucar.pomi" data-i18n="android">Google Play'den indir</a>
    </div>

    <div class="qr">
      <div class="qr-frame">
        <!-- https://pomifocus.com/indir — statik üretildi (segno, hata düzeltme M). -->
        <svg viewBox="0 0 29 29" shape-rendering="crispEdges" role="img" aria-labelledby="qr-caption">

        </svg>
      </div>
      <p id="qr-caption" data-i18n="qr">Telefonunun kamerasıyla okut, doğru mağaza açılsın.</p>
    </div>

    <div class="langs">
      <button class="lang" type="button" data-lang="tr">Türkçe</button>
      <button class="lang" type="button" data-lang="en">English</button>
    </div>
  </main>

<script>
  (function () {
    var DICT = {
      tr: {
        title: "Pomi'yi indir",
        description: "Pomi'yi iPhone, iPad veya Android telefonuna ücretsiz indir: arkadaşlarınla birlikte odaklan.",
        heading: "Pomi'yi indir",
        lede: "Arkadaşlarınla birlikte odaklan. iPhone ve Android'de ücretsiz.",
        ios: "App Store'dan indir",
        android: "Google Play'den indir",
        qr: 'Telefonunun kamerasıyla okut, doğru mağaza açılsın.'
      },
      en: {
        title: 'Download Pomi',
        description: 'Get Pomi free on iPhone, iPad or Android and focus together with your friends.',
        heading: 'Download Pomi',
        lede: 'Focus together with your friends. Free on iPhone and Android.',
        ios: 'Download on the App Store',
        android: 'Get it on Google Play',
        qr: 'Scan with your phone camera to open the right store.'
      }
    };

    var stores = window.POMI_STORES || {};

    function apply(lang) {
      var d = DICT[lang] || DICT.tr;
      document.documentElement.lang = lang;
      document.title = d.title;
      var meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute('content', d.description);
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var value = d[el.getAttribute('data-i18n')];
        if (value != null) el.textContent = value;
      });
      // Masaüstünde açılan web mağaza sayfası seçilen dilde gelsin.
      if (stores.ios) document.getElementById('ios').href = stores.ios + '?l=' + lang;
      if (stores.android) {
        // Android'de buton da Play Store uygulamasını açsın; masaüstünde web sayfası.
        var onAndroid = document.documentElement.getAttribute('data-platform') === 'android';
        document.getElementById('android').href = onAndroid && stores.androidIntent
          ? stores.androidIntent
          : stores.android + '&hl=' + lang;
      }
      document.querySelectorAll('.lang').forEach(function (btn) {
        btn.setAttribute('aria-pressed', String(btn.getAttribute('data-lang') === lang));
      });
      try { localStorage.setItem('pomi-lang', lang); } catch (e) { /* özel mod */ }
    }

    var stored = null;
    try { stored = localStorage.getItem('pomi-lang'); } catch (e) { /* özel mod */ }
    var initial = stored || ((navigator.language || 'tr').slice(0, 2) === 'tr' ? 'tr' : 'en');
    document.querySelectorAll('.lang').forEach(function (btn) {
      btn.addEventListener('click', function () { apply(btn.getAttribute('data-lang')); });
    });
    apply(DICT[initial] ? initial : 'tr');
  })();
</script>
